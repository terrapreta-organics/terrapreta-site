# Generated by scripts/build-decap-config.js. Edit that file, then run: npm run cms-config
backend:
  name: git-gateway
  branch: main
site_url: https://www.terrapreta.ca
display_url: https://www.terrapreta.ca
locale: en
media_folder: src/images
public_folder: /images
publish_mode: editorial_workflow
collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/blog/posts
    create: true
    slug: '{{slug}}'
    summary: '{{title}} ({{date}})'
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
        widget: string
      - name: description
        label: Short summary (shows on the blog page and in Google)
        widget: text
        required: false
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - name: draft
        label: Draft (keeps it off the blog page and out of Google)
        widget: boolean
        default: true
      - name: category
        label: Category
        widget: select
        options:
          - Reclamation
          - Agriculture
          - From the plant
        required: false
      - name: image
        label: Top photo
        widget: image
        required: false
        choose_url: false
      - name: image_alt
        label: Photo description
        widget: string
        required: false
      - name: image_position
        label: Photo focus
        widget: string
        required: false
      - name: body
        label: Post
        widget: markdown
  - name: pages
    label: Pages
    editor:
      preview: false
    files:
      - name: home
        label: Home
        file: src/pages/home.md
        fields:
          - name: layout
            widget: hidden
            default: layouts/page.njk
          - name: permalink
            label: URL
            widget: string
          - name: title
            label: Page name
            widget: string
            required: false
          - name: meta_title
            label: Search title (shows in Google and the browser tab)
            widget: string
            required: false
          - name: meta_description
            label: Search description (about 150 characters)
            widget: text
            required: false
          - name: header_over
            label: Menu over photo
            widget: boolean
            required: false
          - name: hero
            label: Top of page
            widget: object
            fields:
              - name: style
                label: Style
                widget: select
                options:
                  - label: Big photo with title on it
                    value: full
                  - label: Title, then photo
                    value: top
              - name: eyebrow
                label: Small label
                widget: string
                required: false
              - name: title
                label: Big title
                widget: string
                required: false
              - name: intro
                label: Intro line
                widget: text
                required: false
              - name: image
                label: Photo
                widget: image
                required: false
                choose_url: false
              - name: alt
                label: Photo description
                widget: string
                required: false
              - name: position
                label: Photo focus
                widget: string
                required: false
              - name: video
                label: Background video (mp4, no sound, plays on desktop only)
                widget: file
                required: false
              - name: video_webm
                label: Background video, WebM version (optional)
                widget: file
                required: false
              - name: video_poster
                label: Still shown while the video loads
                widget: image
                required: false
              - name: buttons
                label: Buttons
                widget: list
                required: false
                fields:
                  - name: text
                    label: Button text
                    widget: string
                    required: false
                  - name: url
                    label: Link
                    widget: string
                    required: false
                  - name: fill
                    label: Solid button
                    widget: boolean
                    required: false
          - name: blocks
