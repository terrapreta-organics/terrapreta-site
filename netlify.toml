[build]
  # Production deploys (the production branch) run build:prod so DRAFT posts and hidden placeholders drop out.
  # Deploy Previews and branch deploys override this command so drafts can be reviewed on those URLs.
  command = "npm run build:prod"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
